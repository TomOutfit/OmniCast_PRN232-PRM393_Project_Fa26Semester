# ============================================================
# OmniCast - GitHub Actions CI/CD Workflow
# ============================================================

name: OmniCast CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'

jobs:
  # ============================================================
  # Backend Tests & Build (NestJS)
  # ============================================================
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: omnicast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d omnicast_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run unit tests
        # The backend uses Node's native `node:test` runner (see
        # backend/test/runner.js). No DB is needed because every spec
        # injects a fake Prisma client.
        run: npm run test

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/omnicast_test
          DIRECT_URL: postgresql://test:test@localhost:5432/omnicast_test

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist

  # ============================================================
  # Frontend Tests & Build (Next.js)
  # ============================================================
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        # Vitest picks up `lib/**/*.test.ts` and components test files
        # automatically via vitest.config.ts.
        run: npm run test

      - name: Type check
        run: npm run type-check

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://omnicast-api.vercel.app/api

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/

  # ============================================================
  # Mobile Tests & Build (Flutter)
  # ============================================================
  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze || true

      - name: Run Flutter tests
        # Run the data, logic, and presentation suites. Coverage is
        # emitted to coverage/lcov.info for downstream tooling.
        run: |
          flutter test \
            --coverage \
            test/data \
            test/logic \
            test/presentation

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage/lcov.info

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk

  # ============================================================
  # Aggregate Test Summary
  # ============================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, mobile]
    if: always()
    steps:
      - name: Decide result
        run: |
          echo "Backend:   ${{ needs.backend.result }}"
          echo "Frontend:  ${{ needs.frontend.result }}"
          echo "Mobile:    ${{ needs.mobile.result }}"
          if [ "${{ needs.backend.result }}" = "failure" ] || \
             [ "${{ needs.frontend.result }}" = "failure" ] || \
             [ "${{ needs.mobile.result }}" = "failure" ]; then
            echo "One or more test suites failed."
            exit 1
          fi
          echo "All test suites passed."

  # ============================================================
  # Deploy to Vercel (Production)
  # ============================================================
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [backend, frontend, mobile]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Backend
        uses: amondnet/vercel-action@v25
        continue-on-error: true
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
          working-directory: backend

      - name: Deploy Frontend
        uses: amondnet/vercel-action@v25
        continue-on-error: true
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          vercel-args: '--env=NEXT_PUBLIC_API_URL=${{ secrets.VERCEL_API_URL }}'
          working-directory: frontend
