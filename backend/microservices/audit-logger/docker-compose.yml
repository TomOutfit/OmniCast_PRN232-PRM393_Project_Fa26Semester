# ============================================================
# OmniCast - Audit Logger Local Dev Compose
# ============================================================

services:
  audit-logger:
    build: .
    container_name: omnicast-audit-logger
    restart: unless-stopped
    ports:
      - "3100:3100"   # HTTP /health
      - "50051:50051" # gRPC
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/omnicast
      DIRECT_URL: postgresql://postgres:postgres@db:5432/omnicast
      AUDIT_LOGGER_GRPC_URL: 0.0.0.0:50051
      AUDIT_LOGGER_HTTP_PORT: "3100"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: omnicast-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omnicast
    ports:
      - "5432:5432"
    volumes:
      - audit_pgdata:/var/lib/postgresql/data

volumes:
  audit_pgdata:
