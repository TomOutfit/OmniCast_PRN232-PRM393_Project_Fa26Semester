# ============================================================
# OmniCast - MediaMTX Streaming Server
# ============================================================
#
# MediaMTX is a ready-to-use, self-hosted SRT/RTMP server
# for live streaming. This docker-compose setup provides:
#   - RTMP ingest (port 1935)
#   - HLS output (port 8888)
#   - WebRTC (port 8889)
#   - Metrics (port 9997)
#
# Usage:
#   docker-compose -f docker-compose.yml up -d
#
# RTMP Push URL: rtmp://localhost:1935/{stream_key}
# HLS URL: http://localhost:8888/{stream_key}/index.m3u8
# WHIP publish: http://localhost:8889/{stream_key}/whip
# WebRTC: ws://localhost:8889/{stream_key}
# ============================================================

version: '3.8'

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: omnicast-mtx
    restart: unless-stopped
    # Share the EXACT same config as the Windows binary branch so the
    # two never drift. `backend/scripts/start-mediamtx.ps1` rewrites
    # `webrtcICEHostCandidates` / ports inside that file at runtime.
    command: ["/mediamtx", "/mediamtx.yml"]
    ports:
      # RTMP ingest - for OBS, mobile apps
      - "1935:1935"
      # HLS output - for web and mobile players
      - "8888:8888"
      # WebRTC - for low-latency streaming (WHIP publish / WHEP playback)
      - "8889:8889"
      # WebRTC ICE (UDP + TCP)
      - "8189:8189"
      # API + metrics
      - "9997:9997"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - media-data:/var/media
    
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9997/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: FFmpeg for transcoding if needed
  # ffmpeg:
  #   image: jrottenberg/ffmpeg:latest
  #   container_name: omnicast-ffmpeg
  #   volumes:
  #     - media-data:/var/media
  #   environment:
  #     - FFMPEG_INPUT_OPTS: -fflags +genpts
  #   restart: unless-stopped

volumes:
  media-data:
    driver: local

networks:
  default:
    name: omnicast-network
