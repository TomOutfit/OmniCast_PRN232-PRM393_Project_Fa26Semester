# ============================================================
# OmniCast - MediaMTX Streaming Server
# ============================================================
#
# MediaMTX is a self-hosted RTMP / HLS / WebRTC server for live
# streaming. This docker-compose setup provides:
#   - RTMP ingest (port 1935)
#   - HLS output (port 8888)
#   - WebRTC (port 8889 + ICE on 8189)
#   - API (port 9997) + metrics (port 9998)
#
# Usage:
#   cd backend
#   docker compose up -d
#
# RTMP Push URL: rtmp://<host>:1935/{stream_key}
# HLS URL: http://<host>:8888/{stream_key}/index.m3u8
# WHIP publish: http://<host>:8889/{stream_key}/whip
# WebRTC: ws://<host>:8889/{stream_key}
#
# Set `MEDIAMTX_PUBLIC_HOST` to the public DNS name of this server.
# Public deployment should use `MEDIAMTX_BIND_ADDRESS=127.0.0.1` so
# HTTP ingest/playback stays behind Caddy; ICE port 8189 remains public.
# ============================================================

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: omnicast-mtx
    restart: unless-stopped
    # Share the EXACT same config as the Windows binary branch so the
    # two never drift: `./mediamtx/mediamtx.yml` is the single source
    # of truth. `backend/scripts/start-mediamtx.ps1` generates a
    # LOCAL copy of it (`mediamtx.local.yml`) for the native branch
    # and leaves the shared file untouched.
    #
    # The upstream image already has `ENTRYPOINT ["/mediamtx"]`, so
    # `command` must contain ONLY the config path - passing
    # ["/mediamtx", "/mediamtx.yml"] would run
    # `/mediamtx /mediamtx /mediamtx.yml` and MediaMTX's CLI parser
    # (kong) accepts a single positional argument, so the container
    # would fail to start with "unexpected argument".
    command: ["/mediamtx.yml"]
    environment:
      MTX_AUTHMETHOD: http
      MTX_AUTHHTTPADDRESS: "${MEDIAMTX_AUTH_URL:-http://host.docker.internal:3000/api/v1/programs/studio/media-auth}"
      # A container only sees the Docker bridge interface, never the
      # host's LAN adapter, so `webrtcIPsFromInterfaces` alone would
      # advertise an unreachable address. This tells MediaMTX which
      # extra ICE candidate to hand out to browsers.
      # (Env vars take precedence over the YAML file in MediaMTX.)
      MTX_WEBRTCADDITIONALHOSTS: "${MEDIAMTX_PUBLIC_HOST:-127.0.0.1}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # RTMP ingest - for OBS, mobile apps
      - "${MEDIAMTX_BIND_ADDRESS:-0.0.0.0}:1935:1935/tcp"
      # HLS output - for web and mobile players
      - "${MEDIAMTX_BIND_ADDRESS:-0.0.0.0}:8888:8888/tcp"
      # WebRTC - for low-latency streaming (WHIP publish / WHEP playback)
      - "${MEDIAMTX_BIND_ADDRESS:-0.0.0.0}:8889:8889/tcp"
      # WebRTC ICE - media flows over UDP, so the UDP mapping is the
      # one that actually matters. Without it the browser's ICE
      # handshake never completes and the WHIP publish times out.
      - "8189:8189/udp"
      # WebRTC ICE over TCP (fallback path for restrictive networks)
      - "8189:8189/tcp"
      # API - upstream restricts the `api` action to loopback IPs,
      # so this is only reachable from the Docker host itself.
      - "127.0.0.1:9997:9997/tcp"
      # Metrics (Prometheus format) - same loopback restriction.
      - "127.0.0.1:9998:9998/tcp"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - media-data:/var/media

  caddy:
    image: caddy:2
    container_name: omnicast-media-proxy
    profiles: ["public"]
    restart: unless-stopped
    depends_on:
      - mediamtx
    environment:
      MEDIAMTX_PUBLIC_HOST: "${MEDIAMTX_PUBLIC_HOST:?Set MEDIAMTX_PUBLIC_HOST to the public media DNS name}"
      MEDIAMTX_UPSTREAM_HOST: mediamtx
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

    # Validate the mounted Caddy configuration without requiring a
    # shell or an HTTP health endpoint in the minimal container.
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: FFmpeg for transcoding if needed
  # ffmpeg:
  #   image: jrottenberg/ffmpeg:latest
  #   container_name: omnicast-ffmpeg
  #   volumes:
  #     - media-data:/var/media
  #   environment:
  #     - FFMPEG_INPUT_OPTS: -fflags +genpts
  #   restart: unless-stopped

volumes:
  media-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

networks:
  default:
    name: omnicast-network
