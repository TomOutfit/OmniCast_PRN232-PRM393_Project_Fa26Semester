<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="150" viewBox="0 0 400 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="ring-grad-discovery" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C9A7"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>
    <linearGradient id="bg-grad-discovery" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1422"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <!-- Filters -->
    <filter id="glow-discovery" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-white" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="396" height="146" rx="16" fill="url(#bg-grad-discovery)" stroke="#1a2333" stroke-width="1.5"/>

  <!-- Left Accent Vertical Glow Bar -->
  <path d="M4 24C4 18 8 14 14 14L14 136C8 136 4 132 4 126Z" fill="url(#ring-grad-discovery)" opacity="0.9"/>
  <rect x="4" y="28" width="3.5" height="94" rx="1.75" fill="url(#ring-grad-discovery)" filter="url(#glow-discovery)" opacity="0.6"/>

  <!-- Tag / Badge at Top Right -->
  <g transform="translate(315, 20)">
    <rect x="-10" y="0" width="70" height="20" rx="10" fill="rgba(13, 148, 136, 0.2)" stroke="#0d9488" stroke-width="1"/>
    <text x="25" y="14" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#2dd4bf" text-anchor="middle" letter-spacing="1">EXPLORE</text>
  </g>

  <!-- OMNI Ring Icon (Left Side) -->
  <g transform="translate(36, 35)">
    <!-- Outer Glow Orbit -->
    <circle cx="40" cy="40" r="32" stroke="url(#ring-grad-discovery)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="165 40" fill="none" filter="url(#glow-discovery)" opacity="0.5"/>
    <!-- Main Solid Orbit Ring -->
    <circle cx="40" cy="40" r="32" stroke="url(#ring-grad-discovery)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="165 40" fill="none"/>
    <!-- Inner Core Symbol -->
    <g transform="translate(14, 13) scale(1)">
      
      <path d="M26 14L28.5 23.5L38 26L28.5 28.5L26 38L23.5 28.5L14 26L23.5 23.5L26 14Z" fill="#FFFFFF" filter="url(#glow-white)"/>
    
    </g>
  </g>

  <!-- Channel Brand Typography -->
  <g transform="translate(132, 60)">
    <text x="0" y="20" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="1">
      <tspan fill="#FFFFFF">OMNI </tspan>
      <tspan fill="#00F5D4">DISCOVERY</tspan>
    </text>
    <text x="0" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="2">SCIENCE & NATURE</text>
  </g>
</svg>