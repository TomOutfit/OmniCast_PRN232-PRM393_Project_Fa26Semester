<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="150" viewBox="0 0 400 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="ring-grad-cine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FFD600"/>
    </linearGradient>
    <linearGradient id="bg-grad-cine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1422"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <!-- Filters -->
    <filter id="glow-cine" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-white" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="396" height="146" rx="16" fill="url(#bg-grad-cine)" stroke="#1a2333" stroke-width="1.5"/>

  <!-- Left Accent Vertical Glow Bar -->
  <path d="M4 24C4 18 8 14 14 14L14 136C8 136 4 132 4 126Z" fill="url(#ring-grad-cine)" opacity="0.9"/>
  <rect x="4" y="28" width="3.5" height="94" rx="1.75" fill="url(#ring-grad-cine)" filter="url(#glow-cine)" opacity="0.6"/>

  <!-- Tag / Badge at Top Right -->
  <g transform="translate(315, 20)">
    <rect x="-10" y="0" width="70" height="20" rx="10" fill="rgba(202, 138, 4, 0.2)" stroke="#ca8a04" stroke-width="1"/>
    <text x="25" y="14" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#fde047" text-anchor="middle" letter-spacing="1">CINEMA</text>
  </g>

  <!-- OMNI Ring Icon (Left Side) -->
  <g transform="translate(36, 35)">
    <!-- Outer Glow Orbit -->
    <circle cx="40" cy="40" r="32" stroke="url(#ring-grad-cine)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="165 40" fill="none" filter="url(#glow-cine)" opacity="0.5"/>
    <!-- Main Solid Orbit Ring -->
    <circle cx="40" cy="40" r="32" stroke="url(#ring-grad-cine)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="165 40" fill="none"/>
    <!-- Inner Core Symbol -->
    <g transform="translate(14, 13) scale(1)">
      
      <path d="M16 20C16 17.8 17.8 16 20 16H32C34.2 16 36 17.8 36 20V34C36 36.2 34.2 38 32 38H20C17.8 38 16 36.2 16 34V20Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M16 22H36" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <path d="M23 25L30 29.5L23 34V25Z" fill="#FFFFFF"/>
    
    </g>
  </g>

  <!-- Channel Brand Typography -->
  <g transform="translate(132, 60)">
    <text x="0" y="20" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="1">
      <tspan fill="#FFFFFF">OMNI </tspan>
      <tspan fill="#FFAA00">CINE</tspan>
    </text>
    <text x="0" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="2">BLOCKBUSTER</text>
  </g>
</svg>