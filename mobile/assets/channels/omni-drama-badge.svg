<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="150" viewBox="0 0 400 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="ring-grad-drama" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A55"/>
      <stop offset="100%" stop-color="#FF758F"/>
    </linearGradient>
    <linearGradient id="bg-grad-drama" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1422"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <!-- Filters -->
    <filter id="glow-drama" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-white" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="396" height="146" rx="16" fill="url(#bg-grad-drama)" stroke="#1a2333" stroke-width="1.5"/>

  <!-- Left Accent Vertical Glow Bar -->
  <path d="M4 24C4 18 8 14 14 14L14 136C8 136 4 132 4 126Z" fill="url(#ring-grad-drama)" opacity="0.9"/>
  <rect x="4" y="28" width="3.5" height="94" rx="1.75" fill="url(#ring-grad-drama)" filter="url(#glow-drama)" opacity="0.6"/>

  <!-- Tag / Badge at Top Right -->
  <g transform="translate(315, 20)">
    <rect x="-10" y="0" width="70" height="20" rx="10" fill="rgba(219, 39, 119, 0.2)" stroke="#db2777" stroke-width="1"/>
    <text x="25" y="14" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#f472b6" text-anchor="middle" letter-spacing="1">SERIES</text>
  </g>

  <!-- OMNI Ring Icon (Left Side) -->
  <g transform="translate(36, 35)">
    <!-- Outer Glow Orbit -->
    <circle cx="40" cy="40" r="32" stroke="url(#ring-grad-drama)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="165 40" fill="none" filter="url(#glow-drama)" opacity="0.5"/>
    <!-- Main Solid Orbit Ring -->
    <circle cx="40" cy="40" r="32" stroke="url(#ring-grad-drama)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="165 40" fill="none"/>
    <!-- Inner Core Symbol -->
    <g transform="translate(14, 13) scale(1)">
      
      <path d="M26 16C19.5 16 16 20.5 16 26.5C16 33.5 22 38 26 38C30 38 36 33.5 36 26.5C36 20.5 32.5 16 26 16Z" fill="#FFFFFF" filter="url(#glow-white)"/>
      <circle cx="21.5" cy="24" r="1.8" fill="#FF2A55"/>
      <circle cx="30.5" cy="24" r="1.8" fill="#FF2A55"/>
      <path d="M22 32C23.5 30.5 28.5 30.5 30 32" stroke="#FF2A55" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    
    </g>
  </g>

  <!-- Channel Brand Typography -->
  <g transform="translate(132, 60)">
    <text x="0" y="20" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="1">
      <tspan fill="#FFFFFF">OMNI </tspan>
      <tspan fill="#FF4D6D">DRAMA</tspan>
    </text>
    <text x="0" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="2">SERIES & NOVELA</text>
  </g>
</svg>