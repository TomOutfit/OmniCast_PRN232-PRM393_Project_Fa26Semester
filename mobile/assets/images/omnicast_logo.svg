<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="omni-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="omni-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0ea5e9" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="64" height="64" rx="16" fill="#090d16" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#omni-bg)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Outer Pulse Ring -->
  <path d="M 16 32 C 16 23.163 23.163 16 32 16 C 40.837 16 48 23.163 48 32" stroke="url(#omni-glow)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.35" />
  <path d="M 21 32 C 21 25.925 25.925 21 32 21 C 38.075 21 43 25.925 43 32" stroke="url(#omni-glow)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7" />

  <!-- Central Broadcast Beacon Shape -->
  <circle cx="32" cy="32" r="5" fill="url(#omni-bg)" filter="url(#shadow)" />
  <circle cx="32" cy="32" r="2.5" fill="#ffffff" />

  <!-- Broadcast Beam / Wave Elements -->
  <path d="M 32 37 L 32 48" stroke="url(#omni-glow)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 26 48 L 38 48" stroke="url(#omni-glow)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 28 44 L 36 44" stroke="url(#omni-glow)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />
</svg>
